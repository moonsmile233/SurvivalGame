<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SurvivalGame</title>
  <!-- 空的 favicon，避免浏览器自动请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <h1 class="title">SurvivalGame</h1>
    </header>

    <section class="game-frame" aria-label="游戏画面">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-text" class="overlay-text">Loading...</p>
      </div>
    </section>

    <section class="controls">
      <button id="btn-ping" class="btn" type="button" disabled>测试通信</button>
      <p id="bridge-log" class="bridge-log">（尚未收到 Unity 消息）</p>
    </section>

    <footer class="footer">
      <span id="version">v-</span>
    </footer>
  </main>

  <script src="js/app.js"></script>
  <script src="js/bridge.js"></script>
</body>
</html>
