<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>SurvivalGame — 2D 生存挑战</title>
  <!-- 空的 favicon，避免浏览器自动请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=1.1.0">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="header-text">
        <h1 class="title">SurvivalGame</h1>
        <p class="tagline">躲开追踪你的敌人，存活 60 秒</p>
      </div>
      <div class="nickname-field">
        <label class="nickname-label" for="nickname">昵称</label>
        <input id="nickname" class="nickname-input" type="text" maxlength="16" autocomplete="nickname"
               placeholder="玩家" spellcheck="false" disabled>
      </div>
    </header>

    <p class="rotate-hint">横屏体验更佳</p>

    <!-- 难度（M6 §2）：只在 Loading/Ready/Starting 可见，开局后锁死。
         用原生 radio + label：方向键、读屏、disabled 都交给浏览器，不额外写键盘处理。 -->
    <section id="difficulty" class="difficulty" role="radiogroup" aria-label="难度" hidden>
      <div class="difficulty-cards">
        <label class="difficulty-card">
          <input class="difficulty-input" type="radio" name="difficulty" value="easy" disabled>
          <span class="difficulty-name">简单</span>
          <span class="difficulty-desc">敌人更慢、更少</span>
          <span class="difficulty-mult">×1.0</span>
        </label>
        <label class="difficulty-card">
          <input class="difficulty-input" type="radio" name="difficulty" value="normal" disabled>
          <span class="difficulty-name">普通</span>
          <span class="difficulty-desc">标准节奏</span>
          <span class="difficulty-mult">×1.3</span>
        </label>
        <label class="difficulty-card">
          <input class="difficulty-input" type="radio" name="difficulty" value="hard" disabled>
          <span class="difficulty-name">困难</span>
          <span class="difficulty-desc">敌人更快、更多</span>
          <span class="difficulty-mult">×1.6</span>
        </label>
      </div>
      <p id="best-line" class="best-line"><span id="best-label">普通</span>最高分 <b id="best-value">0</b></p>
      <!-- 倍率只乘存活分；胜利奖励固定 200（协议 v2 §3），一句话说清，避免误以为总分乘倍率。 -->
      <p class="difficulty-note">倍率只作用于存活分，胜利奖励固定 +200</p>
    </section>

    <section class="game-frame" aria-label="游戏画面">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-text" class="overlay-text">加载中…</p>
        <div id="error-card" class="error-card" hidden>
          <p id="error-text" class="error-text"></p>
          <button id="btn-retry" class="btn" type="button">重试</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="btn-start" class="btn" type="button" disabled>开始游戏</button>
      <button id="btn-fullscreen" class="btn btn-secondary" type="button">全屏</button>
      <p id="status-hint" class="status-hint" aria-live="polite"></p>
      <p id="fullscreen-hint" class="status-hint" role="status" hidden></p>
    </section>

    <p class="op-hint">
      <span class="op-desktop">操作：WASD / 方向键移动 · Esc / P 暂停 · 躲开敌人 · 存活 60 秒</span>
      <span class="op-touch">操作：拖动屏幕移动 · 点画面内「暂停」 · 躲开敌人 · 存活 60 秒</span>
    </p>

    <section id="result" class="result" aria-live="polite" hidden>
      <p id="result-title" class="result-title"></p>
      <dl class="result-grid">
        <div class="result-item">
          <dt>本次得分</dt>
          <dd id="result-score">0</dd>
        </div>
        <div class="result-item">
          <dt>本难度最高分</dt>
          <dd id="result-best">0</dd>
        </div>
        <div class="result-item">
          <dt>难度</dt>
          <dd id="result-difficulty">普通</dd>
        </div>
        <div class="result-item">
          <dt>昵称</dt>
          <dd id="result-nickname"></dd>
        </div>
        <div class="result-item">
          <dt>存活</dt>
          <dd id="result-survived">0 秒</dd>
        </div>
      </dl>
      <p id="result-record" class="record" hidden>新纪录</p>
      <p class="op-hint">
        <span class="op-desktop">操作：WASD / 方向键移动 · Esc / P 暂停 · 躲开敌人 · 存活 60 秒</span>
        <span class="op-touch">操作：拖动屏幕移动 · 点画面内「暂停」 · 躲开敌人 · 存活 60 秒</span>
      </p>
      <!-- 重开按钮放进结算卡：block:'start' 滚动后卡片与按钮同屏，小屏不会把按钮顶出视口（M4.6/M4.7 响应式）。 -->
      <button id="btn-restart" class="btn" type="button" hidden>重新开始</button>
    </section>

    <footer class="footer">
      <span id="version">v-</span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="build-time">-</span>
    </footer>

    <!-- 全屏时页头/操作区会被隐藏；这个浮动按钮放在画面外的黑边里用于退出（Esc/返回键也可退出）。 -->
    <button id="btn-exit-fullscreen" class="btn fullscreen-exit" type="button" hidden>退出全屏</button>
  </main>

  <script src="js/storage.js?v=1.1.0"></script>
  <script src="js/app.js?v=1.1.0"></script>
  <!-- 压测叠层：没有 ?perf=1&overlay=1 时立即返回，不影响正常页面。必须在 bridge.js 之前。 -->
  <script src="js/perf-overlay.js?v=1.1.0"></script>
  <script src="js/bridge.js?v=1.1.0"></script>
</body>
</html>
