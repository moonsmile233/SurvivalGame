<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>SurvivalGame — 2D 生存挑战</title>
  <!-- 空的 favicon，避免浏览器自动请求 /favicon.ico 产生 404 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=1.3.0">
</head>
<body>
  <!-- v1.2 薄壳：画布在上，昵称/进入/成绩卡在下（桌面与手机一致）。
       难度/开局/暂停/重开/结算都在 Unity 画布内（菜单入口由 EnterGame 打开）。 -->
  <main class="app">
    <div class="stage-wrap">
      <!-- 全屏元素只包含画布：全屏内没有任何网页按钮，退出靠 Esc / 系统手势。 -->
      <div id="game-frame" class="game-frame" aria-label="游戏画面">
        <canvas id="unity-canvas" tabindex="0"></canvas>

        <!-- 加载 / 已就绪 / 错误共用一层；Shell 阶段挡住画布，避免未进入就操作 Unity 菜单。 -->
        <div id="overlay" class="overlay">
          <p id="overlay-text" class="overlay-text">加载中…</p>
          <div id="error-card" class="error-card" hidden>
            <p id="error-text" class="error-text"></p>
            <button id="btn-retry" class="btn btn-primary" type="button">重试</button>
          </div>
        </div>

        <!-- 全屏内 2~3 秒自动消失的提示；不是按钮，不拦截操作。 -->
        <p id="fs-toast" class="fs-toast" role="status" hidden></p>
      </div>
    </div>

    <section class="panel">
      <div class="panel-main">
        <header class="brand">
          <h1 class="title">SurvivalGame</h1>
          <p class="tagline">2D 生存挑战 · 存活 60 秒</p>
        </header>

        <div class="field">
          <label class="field-label" for="nickname">昵称</label>
          <input id="nickname" class="nickname-input" type="text" maxlength="16" autocomplete="nickname"
                 placeholder="玩家" spellcheck="false" disabled>
        </div>

        <div class="actions">
          <button id="btn-start" class="btn btn-primary" type="button" disabled>开始游戏</button>
          <button id="btn-fullscreen" class="btn btn-secondary" type="button" hidden>全屏</button>
        </div>
      </div>

      <div class="panel-side">
        <section class="data" aria-label="成绩数据">
          <div class="data-row">
            <span>最高分</span>
            <b id="data-best">0</b>
          </div>
          <div class="data-row data-row-last">
            <span>最近一局</span>
            <b id="data-last">—</b>
          </div>
        </section>

        <p id="status-hint" class="status-hint" aria-live="polite"></p>
        <p id="fullscreen-hint" class="status-hint" role="status" hidden></p>
        <p class="rotate-hint">横屏体验更佳</p>
        <p class="op-hint">
          <span class="op-desktop">操作：WASD / 方向键移动 · Esc / P 暂停 · 躲开敌人 · 存活 60 秒</span>
          <span class="op-touch">操作：拖动屏幕移动 · 点画面内「暂停」 · 躲开敌人 · 存活 60 秒</span>
        </p>
      </div>

      <footer class="footer">
        <span id="version">v-</span>
      </footer>
    </section>
  </main>

  <script src="js/storage.js?v=1.3.0"></script>
  <script src="js/app.js?v=1.3.0"></script>
  <!-- 压测叠层：没有 ?perf=1&overlay=1 时立即返回，不影响正常页面。必须在 bridge.js 之前。 -->
  <script src="js/perf-overlay.js?v=1.3.0"></script>
  <script src="js/bridge.js?v=1.3.0"></script>
</body>
</html>
